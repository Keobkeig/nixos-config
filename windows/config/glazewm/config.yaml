general:
  startup_commands: []
  shutdown_commands: []
  config_reload_commands: []
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: true
    trigger: "monitor_focus"

gaps:
  inner_gap: "12px"
  outer_gap:
    top: "12px"
    right: "16px"
    bottom: "16px"
    left: "16px"

window_effects:
  focused_window:
    border:
      enabled: true
      color: "#c6a0f6"
  other_windows:
    border:
      enabled: true
      color: "#6e738d"

window_behavior:
  initial_state: "tiling"
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

workspaces:
  - name: "1"
    display_name: "1"
    keep_alive: true
  - name: "2"
    display_name: "2"
    keep_alive: true
  - name: "3"
    display_name: "3"
    keep_alive: true
  - name: "4"
    display_name: "4"
    keep_alive: true
  - name: "5"
    display_name: "5"
    keep_alive: true

window_rules:
  - commands: ["ignore"]
    match:
      - window_process: { equals: "yasb" }
      - window_process: { equals: "Raycast" }
      - window_process: { equals: "PowerToys" }
      - window_title: { regex: "[Pp]icture.in.[Pp]icture" }
        window_class: { regex: "Chrome_WidgetWin_1|MozillaDialogClass" }
  - commands: ["set-floating"]
    match:
      - window_process: { regex: "ms-teams|Teams|OUTLOOK|olk|1Password|Bitwarden|KeePassXC|KeePass|mstsc|msrdc|Zoom|steam|discord|obs64" }

binding_modes:
  - name: "resize"
    keybindings:
      - commands: ["resize --width -2%"]
        bindings: ["h", "left"]
      - commands: ["resize --width +2%"]
        bindings: ["l", "right"]
      - commands: ["resize --height +2%"]
        bindings: ["k", "up"]
      - commands: ["resize --height -2%"]
        bindings: ["j", "down"]
      - commands: ["wm-disable-binding-mode --name resize"]
        bindings: ["escape", "enter", "r"]

keybindings:
  - commands: ["focus --direction left"]
    bindings: ["alt+h"]
  - commands: ["focus --direction right"]
    bindings: ["alt+l"]
  - commands: ["focus --direction up"]
    bindings: ["alt+k"]
  - commands: ["focus --direction down"]
    bindings: ["alt+j"]

  - commands: ["move --direction left"]
    bindings: ["alt+shift+h"]
  - commands: ["move --direction right"]
    bindings: ["alt+shift+l"]
  - commands: ["move --direction up"]
    bindings: ["alt+shift+k"]
  - commands: ["move --direction down"]
    bindings: ["alt+shift+j"]

  - commands: ["wm-enable-binding-mode --name resize"]
    bindings: ["alt+r"]
  - commands: ["toggle-floating --centered"]
    bindings: ["alt+shift+space"]
  - commands: ["toggle-fullscreen"]
    bindings: ["alt+f"]
  - commands: ["shell-exec wt"]
    bindings: ["alt+enter"]
  - commands: ["close"]
    bindings: ["alt+shift+q"]
  - commands: ["wm-reload-config"]
    bindings: ["alt+shift+r"]

  - commands: ["focus --workspace 1"]
    bindings: ["alt+1"]
  - commands: ["focus --workspace 2"]
    bindings: ["alt+2"]
  - commands: ["focus --workspace 3"]
    bindings: ["alt+3"]
  - commands: ["focus --workspace 4"]
    bindings: ["alt+4"]
  - commands: ["focus --workspace 5"]
    bindings: ["alt+5"]

  - commands: ["move --workspace 1"]
    bindings: ["alt+shift+1"]
  - commands: ["move --workspace 2"]
    bindings: ["alt+shift+2"]
  - commands: ["move --workspace 3"]
    bindings: ["alt+shift+3"]
  - commands: ["move --workspace 4"]
    bindings: ["alt+shift+4"]
  - commands: ["move --workspace 5"]
    bindings: ["alt+shift+5"]
